<!doctype html>
<html><head><meta charset="utf-8"><title>Contact Tracker | Teal (test stand-in)</title>
<script src="/config.js"></script>
<style>
  body { font-family: sans-serif; margin: 0; }
  #app { display: flex; gap: 16px; }
  #list { width: 260px; border-right: 1px solid #ccc; }
  .item { padding: 6px; border-bottom: 1px solid #eee; cursor: pointer; }
  .sub { font-size: 12px; color: #666; }
  #main { flex: 1; padding: 8px; }
  section { margin: 12px 0; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; }
  #modal.open { display: block; }
  #modal iframe { width: 480px; height: 780px; margin: 20px auto; display: block; border: 0; background: #fff; }
  .pop { position: absolute; background: #fff; border: 1px solid #999; padding: 6px; z-index: 5; }
  .day-outside { color: #bbb; }
  [role=option] { padding: 2px 8px; cursor: pointer; }
</style></head>
<body>
<nav>Home Resume Builder Trackers Job Search</nav>
<div id="app">
  <aside id="list"><div>Contacts</div><div id="items"></div></aside>
  <main id="main">
    <button id="add" class="inline-flex" data-active="false">
      <svg aria-hidden="true" width="16" height="16"><path d="M5 12h14"></path></svg>Add a New Contact</button>
    <div id="record"></div>
  </main>
</div>
<iframe src="/widget.html" title="Chat" style="width:200px;height:60px"></iframe>
<div id="modal"></div>
<div id="portal"></div>
<script>
const CFG = window.FAKE_CONFIG || {};
const BASE = "/contact-tracker";
const OPTIONS = {
  relationship: ["Self", "Co-worker", "Friend", "Family", "Other", "Recruiter", "Mentor", "Hiring manager", "Alumni"],
  goal: ["Networking", "Informational interview", "Request referral", "Research interviewer", "Research career"],
  status: ["To be contacted", "Follow up needed", "Meeting scheduled", "Thank you sent"],
};
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const ICON = '<svg aria-hidden="true" width="12" height="12"><rect width="10" height="10"></rect></svg>';
let contacts = [];

const $ = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fmt = (iso) => { if (!iso) return ""; const [y, m, d] = iso.split("-"); return `${m}/${d}/${y}`; };
const dateButton = (field, label, iso) => `<div class="w-full lg:w-1/2 xl:w-1/3"><label><div class="h6">${label}</div>
  <button class="inline-flex items-center gap-2 w-full justify-start text-left font-normal" data-active="false" type="button"
    aria-haspopup="dialog" aria-expanded="false" aria-controls="radix-_r_${field}_" data-state="closed" data-date="${field}">${ICON}${fmt(iso) || "Add a date"}</button></label></div>`;

async function api(method, path, body) {
  const res = await fetch(path, {method, body: body ? JSON.stringify(body) : undefined});
  return JSON.parse(await res.text());
}
async function load() {
  contacts = (await api("GET", "/api/contacts")).data;
  renderList(); route();
}
function currentId() { const m = location.pathname.match(/\/contact-tracker\/([0-9a-f-]{36})/); return m && m[1]; }
function go(path) { history.pushState({}, "", path); route(); }
window.addEventListener("popstate", route);

function renderList() {
  const items = document.getElementById("items");
  items.innerHTML = "";
  for (const c of contacts) {
    const el = $(`<div class="item"><div class="nm"></div><div class="sub"></div></div>`);
    el.querySelector(".nm").textContent = `${c.first_name} ${c.last_name}`;
    el.querySelector(".sub").textContent = `${c.title} at ${c.company}`;
    el.addEventListener("click", () => go(`${BASE}/${c.id}`));
    items.appendChild(el);
  }
}

function choiceControl(field, value) {
  if (CFG.nativeSelect) {
    const opts = ['<option value="">Select</option>'].concat(OPTIONS[field].map(
      (o) => `<option ${o === value ? "selected" : ""}>${esc(o)}</option>`)).join("");
    return `<select data-field="${field}">${opts}</select>`;
  }
  return `<button type="button" role="combobox" data-field="${field}"><span>${esc(value || "Select")}</span>${ICON}</button>`;
}

function route() {
  closePopups();
  const record = document.getElementById("record");
  record.innerHTML = "";
  const id = currentId();
  if (!id) return;
  const c = contacts.find((x) => x.id === id);
  if (!c) { record.textContent = "Contact not found"; return; }
  record.innerHTML = `
    <div class="header"><h1>${esc(c.first_name)} ${esc(c.last_name)}</h1>
      <div>${esc(c.title)} at ${esc(c.company)}</div>
      <button id="edit">${ICON}Edit</button> <button>${ICON}Delete</button></div>
    <section><h2>Networking</h2><button aria-label="Collapse">${ICON}</button>
      <label>Relationship</label>${choiceControl("relationship", c.relationship)}
      <label>Goal</label>${choiceControl("goal", c.goal)}
      <label>Status</label>${choiceControl("status", c.status)}
    </section>
    <section><h2>Dates</h2><button aria-label="Collapse">${ICON}</button>
      <label>Date saved</label><input disabled value="${fmt(c.created)}">
      ${dateButton("last_contacted", "Last contacted", c.last_contacted)}
      ${dateButton("follow_up", "Follow up", c.follow_up)}
    </section>
    <section><h2>Contact Information</h2><button aria-label="Collapse">${ICON}</button>
      <div>Email</div><div>${esc(c.email || "-")}</div>
      <div>LinkedIn</div><div>${esc(c.url || "-")}</div>
      <div>Phone Number</div><div>${esc(c.phone || "-")}</div>
      <div>Twitter</div><div>${esc(c.twitter || "-")}</div>
    </section>
    <section><h2>Work Experience</h2><p>Please save this contact on LinkedIn to save work experience</p><span>October 2026</span></section>`;
  record.querySelector("#edit").addEventListener("click", () => openForm(c.id));
  record.querySelectorAll("[role=combobox]").forEach((b) => b.addEventListener("click", () => openListbox(b, c)));
  record.querySelectorAll("select").forEach((s) => s.addEventListener("change", () => update(c.id, {[s.dataset.field]: s.value})));
  record.querySelectorAll("[data-date]").forEach((b) => b.addEventListener("click", () => openCalendar(b, c)));
}

async function update(id, changes) {
  await api("PATCH", `/api/contacts/${id}`, changes);
  contacts = (await api("GET", "/api/contacts")).data;
  renderList(); route();
}

function closePopups() { document.getElementById("portal").innerHTML = ""; }
function place(pop, anchor) {
  const r = anchor.getBoundingClientRect();
  pop.style.left = `${r.left + window.scrollX}px`;
  pop.style.top = `${r.bottom + window.scrollY}px`;
  document.getElementById("portal").appendChild(pop);
}

function openListbox(button, c) {
  closePopups();
  const field = button.dataset.field;
  const pop = $(`<div class="pop" role="listbox"></div>`);
  for (const o of OPTIONS[field]) {
    const opt = $(`<div role="option" aria-selected="${o === c[field]}">${o === c[field] ? ICON : ""}<span></span></div>`);
    opt.querySelector("span").textContent = o;
    opt.addEventListener("click", () => { closePopups(); update(c.id, {[field]: o}); });
    pop.appendChild(opt);
  }
  setTimeout(() => place(pop, button), 100);  // like a real menu, appears a moment later
}

function openCalendar(button, c) {
  closePopups();
  const field = button.dataset.date;
  const start = c[field] ? c[field].split("-").map(Number) : [2026, 10, 8];
  let year = start[0], month = start[1] - 1;
  // Radix popover: its id is the button's aria-controls.
  const pop = $(`<div class="pop" role="dialog" id="${button.getAttribute("aria-controls")}"></div>`);
  const label = (text) => CFG.unlabelledArrows ? "" : `aria-label="${text}"`;
  // shadcn's calendar puts this on EVERY day cell, faded or not.
  const CELL = "h-9 w-9 text-center text-sm p-0 relative [&:has([aria-selected].day-range-end)]:rounded-r-md "
    + "[&:has([aria-selected].day-outside)]:bg-accent/50 [&:has([aria-selected])]:bg-accent focus-within:relative";
  const ORD = (d) => d + (d % 10 === 1 && d !== 11 ? "st" : d % 10 === 2 && d !== 12 ? "nd" : d % 10 === 3 && d !== 13 ? "rd" : "th");
  function draw() {
    const first = new Date(year, month, 1), days = new Date(year, month + 1, 0).getDate();
    const prevDays = new Date(year, month, 0).getDate();
    const cells = [];
    for (let i = first.getDay(); i > 0; i--) cells.push({d: prevDays - i + 1, out: true, m: month - 1});
    for (let d = 1; d <= days; d++) cells.push({d, out: false, m: month});
    for (let d = 1; cells.length % 7; d++) cells.push({d, out: true, m: month + 1});
    let rows = "";
    for (let i = 0; i < cells.length; i += 7) {
      rows += '<tr class="flex w-full mt-2">' + cells.slice(i, i + 7).map((x) => {
        const when = new Date(year, x.m, x.d);
        const iso = `${when.getFullYear()}-${String(when.getMonth() + 1).padStart(2, "0")}-${String(when.getDate()).padStart(2, "0")}`;
        const pick = x.out ? "" : x.d;
        if (CFG.calendarV9) {  // react-day-picker 9: dated, labelled cells
          const name = `${["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][when.getDay()]}, ${MONTHS[when.getMonth()]} ${ORD(x.d)}, ${when.getFullYear()}`;
          return `<td role="gridcell" class="rdp-day ${x.out ? "rdp-outside" : ""} ${CELL}" data-day="${iso}" ${x.out ? 'data-outside="true"' : ""}>`
            + `<button type="button" class="rdp-day_button" aria-label="${name}" data-pick="${pick}">${x.d}</button></td>`;
        }
        // react-day-picker 8 (shadcn): the button is the gridcell; faded days have class day-outside
        return `<td role="presentation" class="${CELL}"><button name="day" role="gridcell" tabindex="-1" type="button"`
          + (CFG.disabledDays ? " disabled" : "")
          + ` class="rdp-button_reset rdp-button inline-flex h-9 w-9 p-0 font-normal ${x.out && !CFG.plainDays ? "day-outside text-muted-foreground opacity-50" : ""}"`
          + ` data-pick="${pick}">${x.d}</button></td>`;
      }).join("") + "</tr>";
    }
    const caption = CFG.calendarV9
      ? `<span class="rdp-caption_label" role="status" aria-live="polite">${MONTHS[month]} ${year}</span>`
      : `<div class="text-sm font-medium" aria-live="polite" role="presentation">${MONTHS[month]} ${year}</div>`;
    pop.innerHTML = `<div class="rdp"><div class="space-y-4"><div class="flex justify-center pt-1 relative items-center">${caption}
      <div class="space-x-1 flex items-center">
      <button type="button" name="previous-month" class="nav" data-step="-1" ${label("Go to previous month")}>${ICON}</button>
      <button type="button" name="next-month" class="nav" data-step="1" ${label("Go to next month")}>${ICON}</button></div></div>
      <table role="grid" class="w-full border-collapse space-y-1"><thead><tr><th>Su</th><th>Mo</th><th>Tu</th><th>We</th><th>Th</th><th>Fr</th><th>Sa</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>`;
    pop.querySelectorAll(".nav").forEach((b) => b.addEventListener("click", () => {
      month += Number(b.dataset.step);
      if (month < 0) { month = 11; year--; } if (month > 11) { month = 0; year++; }
      setTimeout(draw, 50);
    }));
    pop.querySelectorAll("[data-pick]").forEach((b) => b.addEventListener("click", () => {
      if (!b.dataset.pick) return;  // faded days do nothing here
      // Like Teal: the saved date is the day BEFORE the one clicked (unless dateBug is off).
      const when = new Date(year, month, Number(b.dataset.pick) - (CFG.dateBug === false ? 0 : 1));
      const iso = `${when.getFullYear()}-${String(when.getMonth() + 1).padStart(2, "0")}-${String(when.getDate()).padStart(2, "0")}`;
      closePopups(); update(c.id, {[field]: iso});
    }));
  }
  draw();
  place(pop, button);
}

function openForm(id) {
  const modal = document.getElementById("modal");
  modal.innerHTML = `<iframe src="/form.html${id ? "?id=" + id : ""}" title="Contact form"></iframe>`;
  setTimeout(() => modal.classList.add("open"), CFG.slowForm ? 1500 : 100);
}
document.getElementById("add").addEventListener("click", () => openForm(null));
window.addEventListener("message", async (e) => {
  if (!e.data || !["contact-saved", "cancel"].includes(e.data.type)) return;
  const modal = document.getElementById("modal");
  modal.classList.remove("open");
  modal.innerHTML = "";
  if (e.data.type === "contact-saved") {
    if (e.data.created && currentId()) history.pushState({}, "", BASE);  // Save returns to the list
    await load();
  }
});
load();
</script>
</body></html>
